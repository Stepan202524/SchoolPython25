<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="static/css/style.css">
    <title>Forma registration</title>
</head>
<body>
<h1>Регистрация в системе</h1>
<div>
    <form class="login_form" method="post">
        <input type="email" class="form-control" id="email" aria-describedby="emailHelp" placeholder="Enter Email"
        name="email">
        <input type="password" class="form-control" id="pass" placeholder="Enter password" name="password">
        <label for="levelSelect">Uroven` vladeniya PC</label>
        <select name="level" id="levelSelect">
            <option>Vysokiy</option>
            <option>Sredniy</option>
            <option>Nizkiy</option>
        </select>
        <div class="form-group">
            <label for="about">Enter o sebe</label>
            <textarea class="form-control" name="about" id="about" rows="3"></textarea>
        </div>
         <div class="form-group" id="form-group">
            <label for="form-group">Ukajite Vash pol</label>
            <div class="form-chek">
                <input class="form-check-input" type="radio" name="gender" id="male" value="М" checked>
                <label class="form-check-label" for="male">Mujskoy</label>
            </div>
             <div class="form-chek">
                <input class="form-check-input" type="radio" name="gender" id="female" value="Ж" checked>
                <label class="form-check-label" for="female">Jenskiy</label>
            </div>
        </div>
        <div class="form-group form-check">
            <input class="form-check-input" type="checkbox" name="accept" id="acceptRules">
            <label class="form-check-label" for="acceptRules">Soglasen c pravilami</label>
        </div>
        <div>
            <button type="submit" class="button button-primary">Otpravit`</button>
        </div>
    </form>
</div>
</body>
</html>
