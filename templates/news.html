{% extends "base.html" %}

{% block content %}
    <h1>Novosti</h1>
    {% for item in news %}
<div class="row">
       <div class="col-md-6 border rounded">
           <h2>{{ item.title }}</h2>
           <p>{{item.content}}</p>
           <div>Author: {{item.user.name}}</div>
       </div>
</div>
{% endfor %}
{% endblock %}
