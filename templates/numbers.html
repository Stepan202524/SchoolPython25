<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
</head>
<body>
{% if number %}
    {% if number % 2 == 0 %}
        <p>CHislo {{number}} chetnoe!</p>
    {% else %}
        <p>CHislo {{number}} NEchetnoe!</p>
    {% endif %}
{% else %}
<p>Net CHisla!</p>
{% endif %}

</body>
</html>
